name: Scheduled Book Ingestion

on:
  schedule:
    - cron: "3 3 * * 1"  # Every Monday at 03:03 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          INGESTION_MAX_PAGES_PER_QUERY: "3"
          INGESTION_RATE_LIMIT_SEC: "0.5"
        run: python -m ingestion.jobs.run_ingestion

      - name: Commit updated database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/books.duckdb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly book ingestion refresh"
            git push
          fi
